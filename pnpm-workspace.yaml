packages:
  - connectors/*
  - packages/*
  - services/*

allowBuilds:
  # tsx uses esbuild's platform binary to execute TypeScript tests and scan commands.
  esbuild: true

minimumReleaseAgeExclude:
  - '@langchain/langgraph-sdk@1.16.0'
  - '@langchain/langgraph@1.7.4'
  - '@langchain/langgraph-checkpoint-postgres@1.1.3'
