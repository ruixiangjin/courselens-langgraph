services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: courselens
      POSTGRES_USER: courselens
      POSTGRES_PASSWORD: ${STUDY_POSTGRES_PASSWORD:-courselens-local}
    ports:
      - "127.0.0.1:${STUDY_POSTGRES_PORT:-55432}:5432"
    volumes:
      - checkpoints:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "courselens", "-d", "courselens"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  checkpoints:
